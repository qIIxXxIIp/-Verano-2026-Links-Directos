<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Links</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #search {
            width: 400px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .anime-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

.anime-card {
    background: #222;
    border-radius: 8px;
    overflow: hidden;
    transition: 0.2s;
    text-align: center;
}

.anime-card:hover {
    transform: scale(1.05);
}

.anime-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
}

.anime-card a {
    display: block;
    padding: 10px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

        @media(max-width: 900px) {
            .anime-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 600px) {
            .anime-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

</head>

<body>

    <h1>Lista de Animes</h1>

    <div class="search-box">
        <input type="text" id="search" placeholder="Buscar anime...">
    </div>

    <div class="anime-container" id="animeList">

<div class="anime-card" data-name="Lord of Mysteries Specials">
    <a href="https://jkanime.net/guimi-zhi-zhu-tebie-pian-liewu/" target="_blank">
        <img src="imagenes/lord-of-mysteries.jpg">
        Lord of Mysteries Specials
    </a>
</div>

<div class="anime-card" data-name="Heroine? Saint? No, I'm an All-Works Maid (And Proud of It)!">
    <a href="https://jkanime.net/heroine-seijo-iie-all-works-maid-desu-hokori/" target="_blank">
        <img src="imagenes/heroine-all-works-maid.jpg">
        Heroine? Saint? No, I'm an All-Works Maid (And Proud of It)!
    </a>
</div>

<div class="anime-card" data-name="From Overshadowed to Overpowered: Second Reincarnation of a Talentless Sage">
    <a href="https://jkanime.net/rakudai-kenja-no-gakuin-musou-nidome-no-tensei-s-rank-cheat-majutsushi-boukenroku/" target="_blank">
        <img src="imagenes/talentless-sage.jpg">
        From Overshadowed to Overpowered: Second Reincarnation of a Talentless Sage
    </a>
</div>

<div class="anime-card" data-name="The Cat and the Dragon">
    <a href="https://jkanime.net/neko-to-ryuu/" target="_blank">
        <img src="imagenes/the-cat-and-the-dragon.jpg">
        The Cat and the Dragon
    </a>
</div>

<div class="anime-card" data-name="The World is Dancing">
    <a href="https://jkanime.net/world-is-dancing/" target="_blank">
        <img src="imagenes/the-world-is-dancing.jpg">
        The World is Dancing
    </a>
</div>

<div class="anime-card" data-name="The Oblivious Saint Can't Contain Her Power">
    <a href="https://jkanime.net/mujikaku-seijo-wa-kyou-mo-muishiki-ni-chikara-wo-tare-nagasu/" target="_blank">
        <img src="https://cdn.jkdesa.com/assets/images/animes/image/mujikaku-seijo-wa-kyou-mo-muishiki-ni-chikara-wo-tare-nagasu.jpg">
        The Oblivious Saint Can't Contain Her Power
    </a>
</div>

    </div>

        <script>

        const search = document.getElementById("search");
        const animeCards = document.querySelectorAll(".anime-card");

        search.addEventListener("input", () => {

            const text = search.value.toLowerCase();

            animeCards.forEach(card => {

                const name = card.dataset.name.toLowerCase();

                if (name.includes(text)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }

            });

        });

    </script>

</body>
</html>
